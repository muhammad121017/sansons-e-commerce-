version: '3.8'
# ⚠️  Requires a .env file — copy .env.example and fill in real values before deploying.

services:
  # 1. PostgreSQL Database Engine (Internal only)
  postgres:
    image: postgres:15-alpine
    container_name: sansons_db
    restart: always
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-sansons_user} -d ${POSTGRES_DB:-sansons_db}"]
      interval: 5s
      timeout: 5s
      retries: 5

  # 2. Django REST API Backend (Internal only, reached via reverse proxy)
  backend:
    build:
      context: .
      dockerfile: Dockerfile.backend
    container_name: sansons_backend
    restart: always
    environment:
      DB_NAME: ${POSTGRES_DB}
      DB_USER: ${POSTGRES_USER}
      DB_PASSWORD: ${POSTGRES_PASSWORD}
      DB_HOST: postgres
      DB_PORT: 5432
      SECRET_KEY: ${SECRET_KEY}
      DEBUG: "False"
      ALLOWED_HOSTS: ${ALLOWED_HOSTS}
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - media_volume:/app/media
    networks:
      - default
      - proxy_net

  # 3. Next.js Storefront & Admin Portal (Exposed on Port 7989)
  frontend:
    build:
      context: ./sansons-frontend
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_API_URL: /api/
        NEXT_PUBLIC_GOOGLE_CLIENT_ID: ${NEXT_PUBLIC_GOOGLE_CLIENT_ID:-60165557205-2avhk0lr636jviob6rb2hri0cijnka7r.apps.googleusercontent.com}
    container_name: sansons_frontend
    restart: always
    ports:
      - "7989:3000"
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.sansons.rule=Host(`sansons.online`) || Host(`www.sansons.online`)"
      - "traefik.http.routers.sansons.entrypoints=websecure"
      - "traefik.http.routers.sansons.tls.certresolver=letsencrypt"
      - "traefik.http.services.sansons.loadbalancer.server.port=3000"
    depends_on:
      - backend
    networks:
      - default
      - proxy_net

volumes:
  postgres_data:
  media_volume:

networks:
  proxy_net:
    external: true
    name: ${PROXY_NETWORK:-reverse-proxy_default}
