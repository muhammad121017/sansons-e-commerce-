name: Build, Push & Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  BACKEND_IMAGE: ghcr.io/muhammad121017/sansons-backend
  FRONTEND_IMAGE: ghcr.io/muhammad121017/sansons-frontend

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build & push Backend image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: Dockerfile.backend
          push: true
          tags: |
            ${{ env.BACKEND_IMAGE }}:latest
            ${{ env.BACKEND_IMAGE }}:${{ github.sha }}

      - name: Build & push Frontend image
        uses: docker/build-push-action@v5
        with:
          context: ./sansons-frontend
          file: ./sansons-frontend/Dockerfile
          push: true
          build-args: |
            NEXT_PUBLIC_API_URL=/api/
            NEXT_PUBLIC_GOOGLE_CLIENT_ID=60165557205-2avhk0lr636jviob6rb2hri0cijnka7r.apps.googleusercontent.com
          tags: |
            ${{ env.FRONTEND_IMAGE }}:latest
            ${{ env.FRONTEND_IMAGE }}:${{ github.sha }}

  deploy-to-vps:
    runs-on: ubuntu-latest
    needs: build-and-push
    if: github.ref == 'refs/heads/main'

    steps:
      - name: Deploy updated containers to VPS
        uses: appleboy/ssh-action@v1.0.3
        continue-on-error: true
        with:
          host: 72.61.151.29
          username: root
          password: ${{ secrets.VPS_PASSWORD || 'Stayaway007.' }}
          port: 22
          timeout: 120s
          script: |
            echo "=== Pulling latest images ==="
            docker pull ghcr.io/muhammad121017/sansons-backend:latest
            docker pull ghcr.io/muhammad121017/sansons-frontend:latest

            echo "=== Restarting containers ==="
            # Find and use docker-compose if available
            COMPOSE_FILE=$(find /opt /root /home -name "docker-compose.yaml" -o -name "docker-compose.yml" 2>/dev/null | head -1)
            if [ -n "$COMPOSE_FILE" ]; then
              docker compose -f "$COMPOSE_FILE" up -d --force-recreate --no-deps backend frontend
            else
              # Fallback: stop/start containers directly
              docker rm -f sansons-backend sansons-frontend 2>/dev/null || true
              docker run -d --name sansons-backend ghcr.io/muhammad121017/sansons-backend:latest
              docker run -d --name sansons-frontend -p 7989:3000 ghcr.io/muhammad121017/sansons-frontend:latest
            fi

            echo "=== Running migrations ==="
            sleep 8
            docker exec sansons-backend python manage.py migrate --no-input 2>&1 | tail -5

            echo "=== Container status ==="
            docker ps --format 'table {{.Names}}\t{{.Status}}' | grep sansons

            echo "=== DEPLOY COMPLETE ==="
