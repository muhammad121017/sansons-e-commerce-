version: '3.8'

services:
  db:
    image: postgres:15-alpine
    container_name: sansons_postgres
    environment:
      POSTGRES_USER: ${DB_USER:-sansons}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-sansons_secret}
      POSTGRES_DB: ${DB_NAME:-sansons_db}
    ports:
      - "${DB_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-sansons}"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    container_name: sansons_redis
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - redis_data:/data
    command: redis-server --appendonly yes
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

volumes:
  postgres_data:
  redis_data:
